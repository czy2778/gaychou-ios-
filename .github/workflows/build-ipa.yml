name: Build unsigned IPA

# 支持两种仓库形态：
#   A) 根目录直接是源码（有 project.yml）
#   B) 根目录只有 gaychou-ios.zip（本工作流自动解压，且容错 unzip 的警告退出码）
#
# 用法：仓库 → Actions → Build unsigned IPA → Run workflow
#   成功：底部 Artifacts 下载 gayChou-unsigned-ipa.zip
#   失败：红色报错里会带 "::error::" 标记的真实原因（自动转成 annotation）

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        shell: bash
        run: |
          xcodebuild -version || true
          sw_vers || true
          ls -la

      - name: Ensure sources (auto-unzip if needed)
        shell: bash
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/ensure.log"
          exec > >(tee -a "$LOG") 2>&1

          if [ -f project.yml ]; then
            echo "OK: 根目录已有 project.yml，跳过解压"
            exit 0
          fi

          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::根目录既没有 project.yml，也没有 zip 文件"
            exit 1
          fi

          echo "发现压缩包：$ZIP"
          rm -rf _unpack
          mkdir -p _unpack

          # macOS 的 unzip 在遇到 warning 时会返回 1，用 set -e 会误杀；
          # 这里允许非 0，后面再用 project.yml 是否存在来判断。
          unzip -o -q "$ZIP" -d _unpack || echo "unzip 返回非 0（忽略），继续检查内容"

          SRC=$(find _unpack -name project.yml -type f 2>/dev/null | head -n 1 || true)

          # 兜底：仓库里的 zip 若缺失/损坏，直接从发布地址拉一份
          if [ -z "$SRC" ]; then
            echo "仓库 zip 里没有源码，尝试从发布地址回退下载"
            if curl -fsSL -o _fallback.zip "https://aly.gaychou.top/dl/gaychou-ios.zip"; then
              unzip -o -q _fallback.zip -d _unpack || true
              SRC=$(find _unpack -name project.yml -type f 2>/dev/null | head -n 1 || true)
            fi
          fi

          if [ -z "$SRC" ]; then
            echo "::error::解压后找不到 project.yml"
            find _unpack -maxdepth 3 2>/dev/null || true
            exit 1
          fi

          SRCDIR=$(dirname "$SRC")
          echo "源码目录：$SRCDIR"

          shopt -s dotglob 2>/dev/null || true
          for item in "$SRCDIR"/*; do
            [ -e "$item" ] || continue
            if [ "$(basename "$item")" = ".github" ]; then
              continue
            fi
            cp -R "$item" .
          done

          rm -f "$ZIP"
          rm -rf _unpack

          ls -la
          if [ ! -f project.yml ]; then
            echo "::error::复制后根目录仍无 project.yml"
            exit 1
          fi
          echo "OK: 源码已就位"

      - name: Report ensure-sources failure
        if: failure()
        shell: bash
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/ensure.log"
          echo "::error::$(tail -c 1500 "$LOG" 2>/dev/null | tr '\n' '|' || echo 'no log')"

      - name: Install XcodeGen
        shell: bash
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: xcodegen generate

      - name: Build app without code signing
        shell: bash
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/build.log"
          set -o pipefail
          xcodebuild \
            -project gayChou.xcodeproj \
            -scheme gayChou \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$LOG"

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/build.log"
          if [ -f "$LOG" ]; then
            ERRORS=$(grep -E "(error:|fatal error:|Swift Compiler Error)" "$LOG" | head -n 15 | tr '\n' '|')
            if [ -n "$ERRORS" ]; then
              echo "::error::编译错误：$ERRORS"
            else
              echo "::error::$(tail -c 1500 "$LOG" | tr '\n' '|')"
            fi
          else
            echo "::error::没有 build.log"
          fi

      - name: Package into unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/gayChou.app"
          if [ ! -d "$APP" ]; then
            echo "::error::找不到构建产物 $APP"
            find build -name "*.app" -maxdepth 6 || true
            exit 1
          fi
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry gayChou-unsigned.ipa Payload
          ls -lh gayChou-unsigned.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gayChou-unsigned-ipa
          path: out/gayChou-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/ensure.log
          if-no-files-found: warn
          retention-days: 14

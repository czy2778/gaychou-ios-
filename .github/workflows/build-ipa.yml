name: Build unsigned IPA

# 源码来源优先级：
#   1. 仓库根目录有 project.yml  → 用仓库源码
#   2. 否则                      → 从 SRC_URL 下载最新源码包
#
# 用法：仓库 → Actions → Build unsigned IPA → Run workflow
#   成功：底部 Artifacts 下载 gayChou-unsigned-ipa.zip
#   失败：红色报错的 annotation 里带真实编译错误

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  SRC_URL: https://aly.gaychou.top/dl/gaychou-ios.zip

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        shell: bash
        run: |
          xcodebuild -version || true
          sw_vers || true
          ls -la

      - name: Ensure sources
        shell: bash
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/ensure.log"
          exec > >(tee -a "$LOG") 2>&1

          if [ -f project.yml ]; then
            echo "OK: 仓库根目录已有源码"
            exit 0
          fi

          echo "仓库根目录没有源码，从 $SRC_URL 下载"
          rm -rf _unpack
          mkdir -p _unpack
          rm -f _src.zip

          if ! curl -fsSL --retry 3 -o _src.zip "$SRC_URL"; then
            echo "::error::下载源码包失败：$SRC_URL"
            exit 1
          fi
          ls -lh _src.zip

          # macOS 的 unzip 遇 warning 会返回非 0，这里不当作致命错误
          unzip -o -q _src.zip -d _unpack || echo "unzip 返回非 0（忽略）"

          SRC=$(find _unpack -name project.yml -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SRC" ]; then
            echo "::error::源码包里找不到 project.yml"
            find _unpack -maxdepth 3 2>/dev/null || true
            exit 1
          fi

          SRCDIR=$(dirname "$SRC")
          echo "源码目录：$SRCDIR"

          shopt -s dotglob 2>/dev/null || true
          for item in "$SRCDIR"/*; do
            [ -e "$item" ] || continue
            if [ "$(basename "$item")" = ".github" ]; then
              continue
            fi
            cp -R "$item" .
          done

          rm -f _src.zip
          rm -rf _unpack

          ls -la
          if [ ! -f project.yml ]; then
            echo "::error::源码复制后根目录仍无 project.yml"
            exit 1
          fi
          echo "OK: 源码已就位"

      - name: Report ensure-sources failure
        if: failure()
        shell: bash
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/ensure.log"
          echo "::error::$(tail -c 1500 "$LOG" 2>/dev/null | tr '\n' '|' || echo 'no log')"

      - name: Install XcodeGen
        shell: bash
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: xcodegen generate

      - name: Build app without code signing
        shell: bash
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/build.log"
          set -o pipefail
          xcodebuild \
            -project gayChou.xcodeproj \
            -scheme gayChou \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$LOG"

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/build.log"
          if [ -f "$LOG" ]; then
            ERRORS=$(grep -E "(error:|fatal error:|Swift Compiler Error)" "$LOG" | head -n 12 | tr '\n' '|')
            if [ -n "$ERRORS" ]; then
              echo "::error::编译错误：$ERRORS"
            else
              echo "::error::$(tail -c 1500 "$LOG" | tr '\n' '|')"
            fi
          else
            echo "::error::没有 build.log"
          fi

      - name: Package into unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/gayChou.app"
          if [ ! -d "$APP" ]; then
            echo "::error::找不到构建产物 $APP"
            find build -name "*.app" -maxdepth 6 || true
            exit 1
          fi
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry gayChou-unsigned.ipa Payload
          ls -lh gayChou-unsigned.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gayChou-unsigned-ipa
          path: out/gayChou-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/ensure.log
          if-no-files-found: warn
          retention-days: 14

name: Build iOS IPA

# 手机上传 gaychou-ios.zip 后，本工作流会自动解压并编译出未签名 ipa
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack uploaded zip (if any)
        run: |
          shopt -s dotglob
          if [ -f gaychou-ios.zip ]; then
            echo "发现 gaychou-ios.zip，开始解压"
            unzip -q -o gaychou-ios.zip
            if [ -d gaychou-ios ] && [ ! -f project.yml ]; then
              cp -R gaychou-ios/. .
              rm -rf gaychou-ios
            fi
          fi
          rm -f gaychou-ios.zip
          ls -la
          test -f project.yml || { echo "::error::仓库里找不到 project.yml，请确认 zip 已上传"; exit 1; }

      - name: Select Xcode
        run: |
          for v in 15.4 15.3 15.2 15.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, iPhone arm64)
        run: |
          set -o pipefail
          xcodebuild \
            -project Gaychou.xcodeproj \
            -scheme Gaychou \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products -type d -name "*.app" -maxdepth 3 | head -n 1)
          if [ -z "$APP" ]; then echo "::error::没有找到 .app 产物"; exit 1; fi
          echo "App bundle: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr gayChou-unsigned.ipa Payload
          du -h gayChou-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: gayChou-unsigned-ipa
          path: gayChou-unsigned.ipa
          retention-days: 90
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
